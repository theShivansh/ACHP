app:
  name: ACHP
  version: "0.2.0"
  log_level: INFO

# Documentation only: the code reads models from achp/llm/registry.py (the canonical registry,
# with env overrides). Logical agents → physical Groq calls:
models:
  proposer:      {primary: openai/gpt-oss-120b, fallback: openai/gpt-oss-20b, call: proposer}
  adversary_a:   {primary: openai/gpt-oss-120b, fallback: openai/gpt-oss-20b, call: analysis}
  adversary_b:   {primary: openai/gpt-oss-120b, fallback: openai/gpt-oss-20b, call: analysis}
  nil_bundle:    {primary: openai/gpt-oss-120b, fallback: openai/gpt-oss-20b, call: analysis}
  judge:         {primary: openai/gpt-oss-120b, fallback: openai/gpt-oss-20b, call: judge}
  qa:            {primary: openai/gpt-oss-120b, fallback: openai/gpt-oss-20b, call: qa}

cache:
  backend: redis
  host: localhost
  port: 6379
  db: 0
  similarity_threshold: 0.85
  ttl_seconds: 3600
  use_fakeredis: true
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

pipeline:
  max_debate_rounds: 2
  nil_execution: parallel_async
  timeouts:
    retriever: 10
    proposer: 30
    adversary_a: 45
    adversary_b: 45
    nil_supervisor: 60
    judge: 45
    security_validator: 5

metrics:
  weights:
    bis: 0.20
    pcs: 0.20
    eps: 0.20
    nss: 0.20
    cts: 0.20
